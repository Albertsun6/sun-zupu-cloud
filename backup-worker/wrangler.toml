# zupu-backup —— 独立 Worker(每日 cron 把全量数据 JSON 备份到 R2)。
# 用 wrangler 部署:先 `npx wrangler r2 bucket create zupu-backups`,再在本目录 `npx wrangler deploy`,
# 然后 `npx wrangler secret put SUPABASE_URL`、`SUPABASE_SERVICE_ROLE`、`BACKUP_TOKEN`。
# 不想用 CLI 就走 CF 后台(见 README.md)。
name = "zupu-backup"
main = "worker.js"
compatibility_date = "2026-01-01"

# 每日 UTC 19:00 = 北京时间 03:00 自动备份
[triggers]
crons = ["0 19 * * *"]

# 绑定 R2 桶(桶名需先在 CF 后台/CLI 建好)
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "zupu-backups"

# SUPABASE_URL、SUPABASE_SERVICE_ROLE、BACKUP_TOKEN 为 secret,不写真实值,用 `wrangler secret put` 或后台加。
